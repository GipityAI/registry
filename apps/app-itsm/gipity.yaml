version: 1

# app-itsm: an IT service-management starter: incidents, SLAs, a service
# catalog, a knowledge base, and AI-assisted triage driven by workflows.
#
# This manifest is what makes the backend real. Without it `gipity deploy`
# registers nothing (no functions, no DB, no workflows) and the frontend 404s.
#
# ⚠️ SECURITY: like the other starter apps, the frontend talks to the backend
# with the app's PUBLIC token (no user sign-in), so the Records API tables below
# are exposed at `public`: anyone with the app id can read and write the data,
# including incident contents. That's fine for a demo, but ITSM data is
# sensitive: before putting real data in, add Sign in with Gipity, flip the
# tables to `auth_level: member`, and add row-level RBAC so each caller only
# sees what they should. The automation functions are already `auth: member`.
deploy:
  phases:
    # Static frontend (SPA: incidents, catalog, KB, reporting).
    - name: files
      type: static
      source: src

    # Per-project DB: migrations/ define the schema, seed/ loads default
    # categories, priority matrix, SLA definitions, teams, catalog, sample KB.
    - name: database
      type: sql
      source: migrations
      seed: seed
      database: {{DATABASE}}

    # Serverless functions. `suggest-resolution` is the one the browser calls
    # directly (read-only, so it stays `public`). Every other function is run
    # by the workflows below (record triggers + cron) and is `auth: member`:
    # a workflow `function` step runs it as the app owner, and `gipity fn call`
    # works for you and project members, but anonymous callers get 403, so
    # nobody with the URL can rewrite incidents, SLAs or KB articles.
    - name: functions
      type: functions
      source: functions
      functions:
        - name: suggest-resolution
          auth: public
          tables: [incidents, knowledge_articles]
          services: [llm]
          description: "Suggest a resolution for an incident from similar KB articles (browser-facing, read-only)."
        - name: classify-incident
          auth: member
          tables: [incidents, categories, priority_matrix, teams, comments, app_settings]
          services: [llm]
          description: "Workflow: AI-categorise + prioritise a new incident."
        - name: smart-assign
          auth: member
          tables: [incidents, team_members, user_profiles, comments, app_settings]
          description: "Workflow: assign an incident to the best-fit agent on its team."
        - name: calculate-sla
          auth: member
          tables: [incidents, sla_definitions, business_calendars, sla_tasks, comments]
          description: "Workflow: create SLA target tasks for an incident from its priority."
        - name: check-sla-breaches
          auth: member
          tables: [sla_tasks, sla_definitions, incidents, comments, notifications]
          description: "Cron workflow: flag breached/at-risk SLA tasks, note them, notify the assignee."
        - name: escalate-incident
          auth: member
          tables: [incidents, teams, comments, notifications]
          fetch_domains: [hooks.slack.com]
          description: "Workflow: escalate a new P1/P2 incident (manager notification, Slack)."
        - name: auto-close-resolved
          auth: member
          tables: [incidents, sla_tasks, comments, app_settings]
          description: "Cron workflow: close incidents resolved longer than auto_close_days."
        - name: generate-kb-article
          auth: member
          tables: [incidents, categories, comments, knowledge_articles, app_settings]
          services: [llm]
          description: "Workflow: draft a KB article from a resolved incident's thread."
        - name: notify-request-approver
          auth: member
          tables: [service_requests, catalog_items, teams, notifications]
          description: "Workflow: notify the approver of a new service request."
        - name: analyze-sentiment
          auth: member
          tables: [comments, incidents, notifications, app_settings]
          services: [llm]
          description: "Workflow: score a comment's sentiment and escalate frustrated callers."
        - name: collect-kpis
          auth: member
          tables: [incidents, sla_tasks, sla_definitions, kpi_scores]
          description: "Cron workflow: roll up daily KPI scores."
        - name: generate-weekly-digest
          auth: member
          tables: [incidents, sla_tasks, kpi_scores]
          services: [llm, email]
          description: "Cron workflow: summarise the week's incidents + KPIs and email the digest."

    # Who pays for the LLM. The workflow-run AI functions and the browser's AI
    # panels have no signed-in user, so the app owner pays (`user_pays` would
    # fail every one of them). Capped to the small model and 2048 output tokens
    # because the public Records API lets anyone file incidents, which runs
    # classification on your credits: see the SECURITY note above.
    - name: services
      type: services
      services:
        - service: llm
          billing_mode: owner_pays
          allowed_models: [small]
          default_model: small
          max_tokens_cap: 2048

    # Records API: the frontend's read/write path for the app's entities
    # (GET/POST/PUT/DELETE /api/{{PROJECT_GUID}}/records/<table>). Also what the
    # record.after_insert workflow triggers fire on. See the SECURITY note above
    # before exposing real data: these are `public` to match the demo frontend.
    - name: records
      type: records
      tables:
        - { table: incidents, auth_level: public }
        - { table: comments, auth_level: public }
        - { table: categories, auth_level: public }
        - { table: priority_matrix, auth_level: public }
        - { table: teams, auth_level: public }
        - { table: team_members, auth_level: public }
        - { table: sla_definitions, auth_level: public }
        - { table: sla_tasks, auth_level: public }
        - { table: knowledge_articles, auth_level: public }
        - { table: service_requests, auth_level: public }
        - { table: catalog_categories, auth_level: public }
        - { table: catalog_items, auth_level: public }
        - { table: major_incidents, auth_level: public }
        - { table: major_incident_updates, auth_level: public }
        - { table: kpi_scores, auth_level: public }
        - { table: notifications, auth_level: public }
        - { table: business_calendars, auth_level: public }
        - { table: user_profiles, auth_level: public }
        - { table: app_settings, auth_level: public }

    # Workflow automations (record triggers + cron). Reconciled into real
    # workflow records and (re)armed on the scheduler.
    - name: workflows
      type: workflows
      source: workflows
