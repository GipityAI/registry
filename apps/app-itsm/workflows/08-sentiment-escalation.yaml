name: Sentiment Escalation
description: When a comment is added, analyze its sentiment and escalate the incident if the caller is frustrated.
trigger: record.after_insert
table: comments
trigger_condition: "new.comment_type == comment"

steps:
  # Checks ai_sentiment_enabled; on a negative comment adds a work note,
  # raises the incident's escalation level, and notifies the assigned agent.
  - name: analyze
    step_type: function
    config:
      name: analyze-sentiment
      body:
        comment_id: "{{trigger.record.id}}"
