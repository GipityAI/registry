name: KB Auto-Generate
description: When an incident is resolved, generate a draft KB article from the resolution.
trigger: record.after_update
table: incidents
trigger_condition: "new.state == resolved"

steps:
  # Checks ai_kb_generation_enabled and skips incidents with no resolution
  # notes or an existing article.
  - name: generate_article
    step_type: function
    config:
      name: generate-kb-article
      body:
        incident_id: "{{trigger.record.id}}"
