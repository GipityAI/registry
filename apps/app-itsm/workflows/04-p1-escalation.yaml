name: P1/P2 Escalation
description: When a high-priority incident (P1 or P2) is created, notify the team lead, raise its escalation level, and post to Slack if configured.
trigger: record.after_insert
table: incidents
trigger_condition: "new.priority <= 2"

steps:
  - name: escalate
    step_type: function
    config:
      name: escalate-incident
      body:
        incident_id: "{{trigger.record.id}}"
