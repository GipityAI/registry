name: Auto-Categorize & Assign
description: When a new incident is created, classify it with AI and assign it to the best agent.
trigger: record.after_insert
table: incidents

steps:
  # Checks ai_auto_categorize_enabled, applies the classification when it is
  # confident enough, and adds a work note.
  - name: classify
    step_type: function
    config:
      name: classify-incident
      body:
        incident_id: "{{trigger.record.id}}"
    on_failure: continue

  # Checks ai_auto_assign_enabled and assigns within the incident's team
  # (the one classification just set, if any).
  - name: smart_assign
    step_type: function
    config:
      name: smart-assign
      body:
        incident_id: "{{trigger.record.id}}"
    on_failure: continue
