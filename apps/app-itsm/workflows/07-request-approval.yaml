name: Request Approval
description: When a service request needing approval is created, notify the fulfillment team's manager. They decide on the agent portal's Approvals page.
trigger: record.after_insert
table: service_requests
trigger_condition: "new.approval_state == pending"

steps:
  - name: notify_approver
    step_type: function
    config:
      name: notify-request-approver
      body:
        request_id: "{{trigger.record.id}}"
