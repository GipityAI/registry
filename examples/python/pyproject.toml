[project]
name = "gipity-device"
version = "0.1.0"
description = "Python client for devices and scripts on a Gipity app: functions, Records with a change stream that never misses an event, uploads of any size, and offline passkey approval checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gipity_device"]

[tool.pytest.ini_options]
testpaths = ["tests"]
