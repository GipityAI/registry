<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">{{DESCRIPTION_META}}
  <meta property="og:title" content="{{TITLE}}">{{OG_DESCRIPTION}}
  <meta property="og:type" content="website">
  <title>{{TITLE}}</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./images/favicon-192.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
  <link rel="stylesheet" href="./css/styles.css">
  <!-- Import map. "@gipity/i18n" is the copy seam: it points at the local
       monolingual reader (js/i18n.js). `gipity add i18n` overrides it with the
       i18n kit to make the app multi-language - no code changes.
       Add npm packages here too (no install needed), e.g.
       "lodash-es": "https://esm.sh/lodash-es@4.17.21" → import { debounce } from 'lodash-es'; -->
  <script type="importmap">
  {
    "imports": {
      "@gipity/i18n": "./js/i18n.js"
    }
  }
  </script>
  {{JSON_LD_BLOCK}}
  {{ANALYTICS_SCRIPT}}
</head>
<body>
  <main>
    <h1>{{TITLE}}</h1>
    <!-- Agent: build the app's UI here (forms, buttons, result areas, etc.). -->
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
