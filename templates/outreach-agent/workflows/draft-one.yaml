# Child workflow: draft ONE personalized touch. Called per-contact by draft-due.
# The draft step is an LLM step governed by the Outreach agent - NO tools - so its
# soul (your voice) and rules (the playbook, manual + learned) inject automatically.
# It writes from the stored knowledge base; it never reads Gmail on this path.
name: draft-one
description: Draft one personalized, AI-disclosed outreach email from a contact's knowledge.
trigger: manual
agent: Outreach
steps:
  - name: load
    step_type: function
    config:
      name: draft-load
      body:
        contact_guid: "{{trigger.payload.contact_guid}}"

  - name: draft
    step_type: llm
    prompt: |
      Write ONE short outreach email to a person I know, in my voice. Your soul and your
      playbook rules already define HOW I write and the hard constraints (length, one
      call to action, plain punctuation, AI disclosure, personalize only from what is
      known). Follow them. This prompt gives you WHO and WHAT.

      THE PERSON:
      - name: {{load.result.name}}
      - email: {{load.result.email}}
      - company: {{load.result.company}}
      - title: {{load.result.title}}
      - my notes: {{load.result.notes}}

      WHERE THEY ARE IN THE FUNNEL (write in the register that fits this stage):
      - stage: {{load.result.stage_label}}
      - my goal for them at this stage: {{load.result.stage_goal}}
      - recent movement: {{load.result.stage_note}}
      Match the register to the stage: if they have no account, explain plainly what this
      is and why THEY would care; if they signed up but have not built, be warm and
      low-friction and point at the single easiest first thing; if they are already
      building, talk like a peer with a concrete next step tied to what they made.

      WHAT I KNOW ABOUT THEM (their knowledge base - use ONLY these facts, do not invent
      more; if this is thin, stay general and warm rather than fabricating specifics):
      {{load.result.knowledge}}

      THE TOPIC for this email (what to make it about, chosen for their stage):
      - {{load.result.topic_title}}
      - {{load.result.topic_body}}

      THE ASK for this stage (what this email should get them to do):
      {{load.result.ask}}
      Product: {{load.result.product_name}} ({{load.result.product_url}})

      THIS TOUCH - write exactly this one, do not repeat earlier touches:
      - touch {{load.result.touch_number}} of {{load.result.total_touches}}: {{load.result.touch_label}}
      - {{load.result.instruction}}
      Earlier touches already sent to them (do NOT repeat these angles):
      {{load.result.prior_subjects}}

      Sign off as "{{load.result.signature}}".

      Respond with STRICT JSON only (no markdown, no code fences):
      {"subject": string, "body": string, "rationale": string}
      - body: the full plain-text email including the sign-off.
      - rationale: one sentence for me (the reviewer) on why you chose this angle.

  - name: save
    step_type: function
    config:
      name: draft-save
      body:
        contact_guid: "{{trigger.payload.contact_guid}}"
        draft: "{{draft}}"
