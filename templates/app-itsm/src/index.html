<!DOCTYPE html>
<html lang="en">
<head>

    {{ANALYTICS_SCRIPT}}
</head>
<body>
    <div id="app">
        <nav id="sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <span class="sidebar-brand">{{TITLE}}</span>
            </div>
            <div class="sidebar-nav">
                <a href="/agent" class="nav-item" data-link>
                    <span class="nav-icon">&#9632;</span> Dashboard
                </a>
                <a href="/agent/incidents" class="nav-item" data-link>
                    <span class="nav-icon">&#9888;</span> Incidents
                </a>
                <a href="/agent/incidents/new" class="nav-item" data-link>
                    <span class="nav-icon">&#43;</span> New Incident
                </a>
                <a href="/agent/knowledge" class="nav-item" data-link>
                    <span class="nav-icon">&#128218;</span> Knowledge
                </a>
                <a href="/agent/sla" class="nav-item" data-link>

                <a href="/agent/approvals" class="nav-item" data-link>

                </a>
                <a href="/agent/reports" class="nav-item" data-link>

                </a>
                <a href="/agent/settings" class="nav-item" data-link>
                    <span class="nav-icon">&#9881;</span> Settings
                </a>
                <div class="nav-divider"></div>
                <a href="/" class="nav-item" data-link>
                    <span class="nav-icon">&#127968;</span> Portal
                </a>
            </div>
        </nav>
        <main id="main-content" class="main-content">
            <!-- Pages render here -->
        </main>

    <!-- Command Palette -->
    <div id="command-palette" class="command-palette hidden">
        <div class="command-palette-backdrop"></div>
        <div class="command-palette-modal">
            <input type="text" id="command-input" class="command-input" placeholder="Type a command..." autocomplete="off">
            <ul id="command-list" class="command-list"></ul>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/main.js"></script>

</html>
