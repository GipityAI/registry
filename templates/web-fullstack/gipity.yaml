version: 1

# Project: {{PROJECT_GUID}}
#
# Frontend (src/)          → CDN
# Migrations (migrations/) → your Gipity database
# Functions (functions/)   → serverless endpoints
#
# Call an endpoint with:
#   curl -s -X POST {{API_BASE}}/api/{{PROJECT_GUID}}/fn/<function_name> \
#     -H 'Content-Type: application/json' -d '{}'
#
# With `auth: public` that URL accepts POSTs from anywhere on the internet - it
# is the address to hand to external callers (webhooks, devices, third-party
# services). Caveat: if the host above is a localhost/docker address, this app
# deploys through a LOCAL dev platform instance and the URL is reachable only
# from this dev environment - never give it to external callers or end users.
#
# Response shape: raw HTTP wraps the result as {"data": ...}. Everything else -
# ctx.fn.call in tests, `gipity fn call`, and the client Gipity.fn - returns it
# unwrapped: use result.field, never result.data.field.

# Optional: style the "Sign in with Gipity" login/consent page - and ONLY that
# page, not your app's own UI. Uncomment and `gipity deploy` to apply. Omit any
# field to keep the Gipity default. See the deploy skill ("auth_branding").
# auth_branding:
#   app_name: My App
#   primary_color: "#f26522"   # quote it - a bare # is a YAML comment
#   tagline: Welcome back

deploy:
  phases:
    # Static files - frontend HTML/CSS/JS
    - name: files
      type: static
      source: src

    # Database migrations - each migrations/*.sql runs once, in filename order.
    # Write yours as migrations/001-<name>.sql; the phase is skipped while the
    # directory is empty. Give tables a `short_guid VARCHAR(20) PRIMARY KEY`
    # (make one with guid('item') in a function) and index what you filter on.
    # Don't INSERT reference/catalog rows in a migration - the `gipity test` DB
    # reset truncates them. Use a seed dir (`seed:` here) or `test: preserve:`.
    - name: database
      type: sql
      source: migrations
      database: {{DATABASE}}

    # Serverless functions. Deploy auto-declares any new functions/<name>.js
    # here as `auth: public` - you edit an entry ONLY to change something.
    # Fields: name, auth (public|user|member), tables, fetch_domains, services
    # Skipped while the directory is empty; deleting a file takes its endpoint down.
    - name: functions
      type: functions
      source: functions

    # Scheduled / triggered workflows. Already wired: drop a file in workflows/
    # and `gipity deploy` creates it and arms its schedule - nothing to add here.
    # Skipped while the directory is empty. A daily job is one file:
    #
    #   # workflows/morning-digest.yaml
    #   name: morning-digest
    #   trigger: schedule          # or record.after_insert / webhook / manual
    #   cron: "0 7 * * *"          # UTC; add `timezone: America/New_York` for local
    #   steps:
    #     - name: build
    #       step_type: function    # calls functions/build-digest.js with full db access
    #       config: { name: build-digest }
    #
    # An `llm` step (prompt:, no config) runs as your default agent automatically.
    # See the `workflow` skill for step types, foreach, conditions, and approvals.
    - name: workflows
      type: workflows
      source: workflows

    # Records API - expose a DB table as auto CRUD endpoints
    #   (GET/POST/PUT/DELETE {{API_BASE}}/api/{{PROJECT_GUID}}/records/<table>).
    # This is how a browser writes to the DB directly, and how record.after_insert
    # workflow triggers fire. Must come AFTER the database phase (the table has to
    # exist first). auth_level: public lets anonymous, signed-out visitors write -
    # the right choice for a public contact form. Defaults: member (sign-in required).
    # NOTE: this is the native Records API, NOT the `records` kit (which is for
    # signed-in member CRUD). For a public form, use this, not `gipity add records`.
    # - name: records
    #   type: records
    #   tables:
    #     - table: contact_messages
    #       auth_level: public
    #       searchable: false
