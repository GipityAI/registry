<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Apply the saved Gipity theme before styles load (no flash). Set via Gipity.setTheme('dark'|'light'|'blue'). -->
  <script>(function(){try{var t=localStorage.getItem('gipity-theme');if(t==='light'||t==='blue')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">{{DESCRIPTION_META}}
  <meta property="og:title" content="{{TITLE}}">{{OG_DESCRIPTION}}
  <meta property="og:type" content="website">
  <title>{{TITLE}}</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./images/favicon-192.png">
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css">
  <link rel="stylesheet" href="./css/gipity-theme.css">
  <link rel="stylesheet" href="./css/styles.css">
  <script type="importmap">
  { "imports": {} }
  </script>
  {{JSON_LD_BLOCK}}
  {{ANALYTICS_SCRIPT}}
</head>
